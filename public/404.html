<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0f1c1a" />
    <title>Page not found — Erik Parra Williams</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light;
        --ink: #12181a;
        --muted: #5c6b70;
        --accent: #0f6e62;
        --accent-deep: #0a4f46;
        --paper: #fafcfc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        font-family: Figtree, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 10% -10%, #d7ebe6 0%, transparent 55%),
          linear-gradient(180deg, #f3f7f8 0%, var(--paper) 100%);
      }
      main {
        width: min(100%, 36rem);
      }
      p { color: var(--muted); line-height: 1.6; }
      h1 {
        margin: 0 0 0.75rem;
        font-family: "Bricolage Grotesque", Georgia, serif;
        font-size: clamp(2.4rem, 6vw, 3.4rem);
        letter-spacing: -0.04em;
        line-height: 0.95;
      }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; margin-top: 1.5rem; }
      a { color: var(--accent-deep); font-weight: 600; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        This portfolio is a single page. Work, about, resume, and contact are
        sections of the home page, not separate addresses.
      </p>
      <nav aria-label="Available sections">
        <a href="/">Home</a>
        <a href="/#work">Work</a>
        <a href="/#about">About</a>
        <a href="/#resume">Resume</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
